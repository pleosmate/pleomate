<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동료 움직임 검토</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 24px;background:#55594e;color:#fffcf6;font:16px system-ui,sans-serif}
main{max-width:1000px;margin:auto}h1{margin:0 0 12px}p{color:#e3e1d8;line-height:1.6}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select,input{font:inherit}
button,select{background:#62665c;color:inherit;border:1px solid #ffffff40;border-radius:24px;padding:10px 16px}
select option{background:#55594e}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.gallery{grid-template-columns:repeat(3,1fr)}figure{margin:0;border:1px solid #ffffff30;border-radius:24px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:6/5}figcaption{text-align:center;padding:0 12px 18px}
@media(max-width:650px){.gallery{grid-template-columns:repeat(2,1fr)}.grid:not(.gallery){grid-template-columns:1fr}}
</style>
<main>
<h1>동료 움직임 검토</h1>
<p>같은 몸·두 팔·두 발로 이어지는 2.5D 모션입니다. 곰은 묵직하게, 토끼는 조금 빠르게 움직입니다.</p>
<div class="controls">
<select id="motion" aria-label="모션"><option value="idle">휴식 · 호흡과 깜빡임</option><option value="smile">기본 웃음</option><option value="wave">손 인사</option><option value="curious">갸웃하기</option><option value="jump">점프</option><option value="celebrate">축하</option><option value="run">달리기</option></select>
<select id="direction" aria-label="달리기 방향"><option>정면</option><option>왼쪽</option><option>오른쪽</option><option>뒷면</option><option>앞 왼쪽</option><option>앞 오른쪽</option></select>
<button id="toggle">일시정지</button>
</div>
<label>동작 위치 <input id="phase" type="range" min="0" max="1" step="0.005" value="0"><span id="phase-label">자동 재생</span></label>
<div class="grid" id="heroes" style="margin-top:20px"></div>
<h2>6방향 달리기</h2><div class="grid gallery" id="gallery"></div>
<p>실제 차량 속도에 따른 홈 자동 전환은 아직 연결하지 않았습니다. 이 화면은 모션의 모양을 검토하는 미리보기입니다.</p>
</main>
