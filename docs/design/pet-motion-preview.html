<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pleos 동료 · 움직임 시안</title>
<style>
:root{color-scheme:light dark;--bg:#f8f8f5;--fg:#252a2b;--muted:#596164;--line:#d7dddf;--accent:#516e82;--surface:#eef1f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}main{max-width:820px;padding:32px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;margin:12px 0 4px}p{margin:0 0 16px}.small{font-size:14px;color:var(--muted)}.level{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.track{height:5px;flex:1;min-width:80px;max-width:340px;background:var(--line);border-radius:8px}.track span{display:block;width:40%;height:100%;background:var(--accent);border-radius:8px}svg{display:block;width:100%;max-width:650px;margin:0 auto;height:auto}h2{font-size:24px;font-weight:500;text-align:center;margin:0 0 32px}.mission{border-block:1px solid var(--line);padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.mission p{margin:0;color:var(--muted)}.tag{font-size:14px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}button{font:inherit;min-height:52px;padding:12px 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px}.breath{transform-origin:180px 235px;animation:breath 4.4s linear infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.4s linear infinite}.hello{transform-origin:180px 230px}.waving{transform-origin:248px 168px}.greeting .hello{animation:hello 1.5s linear}.greeting .waving{animation:wave 1.5s linear}.stopped *{animation:none!important}.backgrounded *{animation-play-state:paused!important}@keyframes breath{0%,50%,100%{transform:scale(1)}25%{transform:scale(1.003,1.009)}75%{transform:scale(.997,.991)}}@keyframes blink{0%,57%,61%,100%{transform:scaleY(1)}59%{transform:scaleY(.08)}}@keyframes hello{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}65%{transform:rotate(-3deg)}}@keyframes wave{0%,100%{transform:rotate(0)}25%,65%{transform:rotate(-36deg)}45%,80%{transform:rotate(-15deg)}}@media(prefers-color-scheme:dark){:root{--bg:#1e2428;--fg:#f2efe9;--muted:#bdc5ca;--line:#485258;--surface:#303a40;--accent:#789bb1}}@media(prefers-reduced-motion:reduce){.breath,.blink,.hello,.waving{animation:none!important}}@media(max-width:520px){main{padding:20px}header{align-items:flex-start;flex-direction:column;gap:0}h1{font-size:26px}.mission{align-items:flex-start;flex-direction:column}.controls button{flex:1}}
</style>
<main>
<header><div><p class="small">PLEOS MATE · 움직임 시안</p><h1>나의 동료</h1></div><span class="tag">Android 앱용 2.5D 동작 검토</span></header>
<div class="level"><strong>Lv. 3</strong><div class="track" role="progressbar" aria-label="경험치 시안" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"><span></span></div><span class="small">40 / 100 XP · 예시</span></div>
<svg id="scene" viewBox="0 0 360 300" role="img" aria-labelledby="pet-title pet-desc">
<title id="pet-title">작은 공간의 동료</title><desc id="pet-desc">천천히 숨쉬고 가끔 눈을 깜빡입니다. 인사하기를 누르면 잠깐 기울어지며 손을 흔듭니다.</desc>
<defs>
<radialGradient id="shadow"><stop stop-color="#32281e" stop-opacity=".14"/><stop offset="1" stop-color="#32281e" stop-opacity="0"/></radialGradient>
<linearGradient id="base" x2="0" y2="1"><stop stop-color="#efe3cd"/><stop offset="1" stop-color="#cdbb9f"/></linearGradient>
<linearGradient id="top" x2="1" y2="1"><stop stop-color="#fff8eb"/><stop offset="1" stop-color="#e7dac2"/></linearGradient>
<radialGradient id="skin" cx="35%" cy="25%" r="80%"><stop stop-color="#fffdf2"/><stop offset=".65" stop-color="#f6ecd7"/><stop offset="1" stop-color="#d7c1a0"/></radialGradient>
</defs>
<ellipse cx="180" cy="252" rx="156" ry="31" fill="url(#shadow)"/>
<ellipse cx="180" cy="247" rx="152" ry="23" fill="url(#base)"/>
<ellipse cx="180" cy="235" rx="152" ry="20.5" fill="url(#top)"/>
<ellipse cx="84" cy="224" rx="36" ry="13" fill="#dbdbd6"/>
<g class="breath"><g class="hello">
<ellipse cx="125.5" cy="92.5" rx="22.5" ry="30.5" fill="#ebd8ba"/><ellipse cx="124.5" cy="93" rx="13.5" ry="20" fill="#f7d3b5"/>
<ellipse cx="234" cy="98.5" rx="21" ry="28.5" fill="#ecdabd"/><ellipse cx="233.5" cy="98.5" rx="12.5" ry="18.5" fill="#f7d3b5"/>
<path d="M104 218 C78 198 82 150 102 116 C122 79 178 67 216 91 C253 112 276 171 256 207 C244 237 129 237 104 218Z" fill="url(#skin)"/>
<ellipse cx="149.5" cy="226.5" rx="16.5" ry="13.5" fill="#f4e4c9"/><ellipse cx="221" cy="224.5" rx="16" ry="13.5" fill="#f0debf"/>
<g class="waving"><ellipse cx="256" cy="173" rx="12" ry="19" fill="#f2e0c0"/></g>
<g class="blink" fill="#433429"><ellipse cx="145" cy="153" rx="5" ry="6.6"/><ellipse cx="212" cy="153" rx="5" ry="6.6"/></g>
<g fill="#e49977" opacity=".31"><ellipse cx="135.5" cy="170" rx="10.5" ry="5"/><ellipse cx="224.5" cy="170" rx="10.5" ry="5"/></g>
<path d="M173 165 Q179.5 174 186 165" fill="none" stroke="#5e402c" stroke-width="3" stroke-linecap="round"/>
</g></g>
</svg>
<h2 id="greeting" aria-live="polite">오늘도 함께할까?</h2>
<div class="mission"><div><strong>바람 느끼기</strong><p>차량 미션과 연결할 다음 경험</p></div><span class="small">미션·보상 연동 전</span></div>
<div class="controls" aria-label="움직임 검토"><button class="primary" id="hello" type="button">다시 인사하기</button><button id="restrict" type="button" aria-pressed="false">주행 제한 체험 · 시연</button></div>
<p class="small" id="motion-status" aria-live="polite">작은 숨쉬기 · 가끔 눈 깜빡임 · 짧은 인사</p>
<footer>동작과 분위기를 확인하는 시안입니다. 최종 3D·미션·SDK·실제 주행 상태는 연동하지 않습니다. 제한 체험은 수동 시연이며, 탭을 숨기거나 시스템의 동작 줄이기를 켜면 움직임을 중단합니다.</footer>
</main>
<script>
const scene=document.getElementById('scene'),hello=document.getElementById('hello'),restrict=document.getElementById('restrict'),message=document.getElementById('greeting'),statusText=document.getElementById('motion-status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let restricted=false,timer;
function stopGreeting(){clearTimeout(timer);scene.classList.remove('greeting')}
function update(){stopGreeting();const stopped=restricted||reduced.matches;scene.classList.toggle('stopped',stopped);scene.classList.toggle('backgrounded',document.hidden);hello.disabled=stopped;restrict.setAttribute('aria-pressed',String(restricted));restrict.textContent=restricted?'사용 허용 상태로 복귀 · 시연':'주행 제한 체험 · 시연';message.textContent=restricted?'사용이 허용되면 다시 만나요':'오늘도 함께할까?';statusText.textContent=restricted?'제한 시연 · 모든 움직임 중단':reduced.matches?'시스템 동작 줄이기 · 정적인 모습으로 표시':'작은 숨쉬기 · 가끔 눈 깜빡임 · 짧은 인사'}
function greet(){if(restricted||reduced.matches||document.hidden)return;stopGreeting();void scene.getBoundingClientRect();scene.classList.add('greeting');timer=setTimeout(stopGreeting,1500)}
hello.onclick=greet;restrict.onclick=()=>{restricted=!restricted;update()};document.addEventListener('visibilitychange',update);window.addEventListener('pagehide',stopGreeting);reduced.addEventListener('change',update);update();greet();
</script>
</html>
